name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check committed Action distribution
        run: git diff --exit-code -- dist
      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --print "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Pack release artifact and checksum
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --print "require('./package.json').version")"
          asset="dsh-forge-${package_version}.tgz"
          npm pack --ignore-scripts
          sha256sum "$asset" > SHA256SUMS
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --print "require('./package.json').version")"
          release_flags=(--generate-notes)
          if [[ "$package_version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${release_flags[@]}" "${{ steps.artifact.outputs.asset }}" SHA256SUMS
      - name: Update major Action tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node --print "require('./package.json').version")"
          major_tag="v${package_version%%.*}"
          git tag --force "$major_tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major_tag"
