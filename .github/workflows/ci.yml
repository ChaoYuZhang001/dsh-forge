name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check committed Action distribution
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: git diff --exit-code -- dist
      - run: node dist/cli/main.js verify fixtures/public/healthy-plugin --smoke

  secret-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject committed credential-shaped files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env|.*\.(pem|p12|pfx|key))$'; then
            echo 'credential-shaped file is tracked' >&2
            exit 1
          fi

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Consume the repository as an Action
        id: accepted
        uses: ./
        with:
          target: fixtures/public/monorepo
          platform: linux-x64
          artifact-name: action-smoke-receipt
      - name: Check Action outputs and Receipt
        shell: bash
        env:
          RECEIPT_STATUS: ${{ steps.accepted.outputs.status }}
          RECEIPT_PATH: ${{ steps.accepted.outputs['receipt-path'] }}
        run: |
          test "$RECEIPT_STATUS" = "pass"
          test -f "$RECEIPT_PATH"
          node -e "const fs = require('node:fs'); const receipt = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8')); if (receipt.status !== 'pass' || receipt.target.packagePath !== 'packages/example-plugin/package.json') process.exit(1)"
      - name: Reject an incompatible plugin through the Action gate
        id: rejected
        continue-on-error: true
        uses: ./
        with:
          target: fixtures/public/incompatible-plugin
          platform: linux-x64
          smoke: 'false'
          upload-receipt: 'false'
          receipt-path: incompatible-receipt.json
      - name: Check failure gate
        if: always()
        shell: bash
        env:
          ACTION_OUTCOME: ${{ steps.rejected.outcome }}
          RECEIPT_STATUS: ${{ steps.rejected.outputs.status }}
        run: |
          test "$ACTION_OUTCOME" = "failure"
          test "$RECEIPT_STATUS" = "fail"
